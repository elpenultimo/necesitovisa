name: Update visa dataset

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 1 * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Download maintained dataset
        run: curl --fail --location --retry 3 -o /tmp/passport-index-matrix.csv https://raw.githubusercontent.com/imorte/passport-index-data/main/passport-index-matrix.csv
      - name: Validate, compare and update
        run: node scripts/updateVisaDataset.mjs /tmp/passport-index-matrix.csv
      - name: Regenerate site data
        run: node scripts/buildVisaData.mjs
      - name: Verify production build
        run: npm run build
      - name: Create update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'data: update visa requirements dataset'
          branch: bot/update-visa-dataset
          delete-branch: true
          title: 'data: actualizar requisitos de visa'
          body: |
            Actualización automática desde `imorte/passport-index-data`.

            El workflow valida la estructura del CSV, bloquea cambios silenciosos en la lista/nombres de países, genera `data/generated/dataset-changes.json`, regenera los datos del sitio y exige que el build termine correctamente antes de crear este PR.
          labels: data-update
